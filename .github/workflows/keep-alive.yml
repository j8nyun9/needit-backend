name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 실행
  workflow_dispatch:          # GitHub에서 손으로도 실행할 수 있게

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend /health
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "진짜주소/health"
